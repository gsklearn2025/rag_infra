[project]
name = "rag-infra"
version = "0.1.0"
description = "This is an experiment project for RAG Infra build"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "opensearch-py>=3.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "anyio[trio]>=4.10.0",
    "asgi-lifespan>=2.1.0",
    "jupyter>=1.1.1",
    "mypy>=1.17.1",
    "notebook>=7.4.5",
    "polyfactory>=2.22.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-aiohttp>=1.1.0",
    "pytest-cov>=6.3.0",
    "pytest-dotenv>=0.5.2",
    "pytest-env>=1.1.5",
    "pytest-mock>=3.15.0",
    "ruff>=0.12.12",
    "testcontainers>=4.12.0",
    "types-sqlalchemy>=1.4.53.38",
]

[tool.ruff]
line-length = 130
exclude = ["notebooks/**", ".venv/**"]
src = ["src", "tests"]
lint.select = [
  "I",
]
